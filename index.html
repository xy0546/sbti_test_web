<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SBTI 傻大人格测试</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            animation: bg 10s linear infinite alternate;
        }

        @keyframes bg {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(20deg); }
        }

        .box {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .title {
            text-align: center;
            font-size: 26px;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .question {
            font-size: 16px;
            margin: 15px 0;
            padding: 15px;
            background: #f7f8ff;
            border-left: 4px solid #764ba2;
            border-radius: 10px;
        }

        .option {
            display: block;
            padding: 10px 14px;
            background: #f1f3ff;
            border-radius: 8px;
            margin: 8px 0;
            cursor: pointer;
        }

        .option:hover {
            background: #d5d9ff;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            margin-top: 20px;
            cursor: pointer;
        }

        .result {
            text-align: center;
            animation: zoom 0.6s ease;
        }

        @keyframes zoom {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .icon {
            font-size: 70px;
            margin: 20px 0;
        }

        .name {
            font-size: 26px;
            color: #764ba2;
            margin-bottom: 10px;
        }

        .desc {
            font-size: 16px;
            color: #444;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .share {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .share button {
            width: auto;
            padding: 8px 16px;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div class="box" id="app"></div>
    <script src="script.js"></script>
</body>
</html>
